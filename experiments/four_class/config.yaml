# Four-Class Experiment Configuration

# Classes
num_classes: 4
class_labels:
  0: "Allowed"
  1: "Obscene Language"
  2: "Mature Content"
  3: "Algospeak"

# Model
model_name: "vinai/bertweet-base"
embedding_dim: 768
max_length: 128

# Training
batch_size: 32
learning_rate: 2.0e-5
weight_decay: 0.01
num_epochs: 20
warmup_steps: 100
early_stopping_patience: 5
fp16: true
gradient_clip: 1.0

# Loss — ablation tested 0.07/0.10/0.15/0.20; 0.15 chosen (see docs/temperature_ablation.md)
temperature: 0.15

# Paths (relative to project root)
train_csv: "experiments/four_class/data/splits/train.csv"
val_csv:   "experiments/four_class/data/splits/val.csv"
test_csv:  "experiments/four_class/data/splits/test.csv"
prepared_dir:   "experiments/four_class/data/prepared"
checkpoint_dir: "experiments/four_class/checkpoints"
results_dir:    "experiments/four_class/results"
