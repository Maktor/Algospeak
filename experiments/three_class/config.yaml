# Three-Class Experiment Configuration
# Classes: 0=Allowed, 1=Harmful Content (original 1+2 combined), 2=Algospeak (original 3)

num_classes: 3
class_labels:
  0: "Allowed"
  1: "Harmful Content"
  2: "Algospeak"

# Model (same architecture)
model_name: "vinai/bertweet-base"
embedding_dim: 768
max_length: 128

# Training
batch_size: 32
learning_rate: 2.0e-5
weight_decay: 0.01
num_epochs: 30
warmup_steps: 200
early_stopping_patience: 3
fp16: true
gradient_clip: 1.0

# Loss
temperature: 0.07

# Paths (relative to project root)
train_csv:      "experiments/three_class/data/splits/train.csv"
val_csv:        "experiments/three_class/data/splits/val.csv"
test_csv:       "experiments/three_class/data/splits/test.csv"
prepared_dir:   "experiments/three_class/data/prepared"
checkpoint_dir: "experiments/three_class/checkpoints"
results_dir:    "experiments/three_class/results"
